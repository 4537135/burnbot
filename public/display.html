<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burnbot</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="/pixel.css">
<style>
  @property --bg-a { syntax: "<color>"; inherits: true; initial-value: #141922; }
  :root {
    /* One unit is 1% of the largest 16:9 box that fits the window, so the
       layout scales to any size. Text sizes are then rounded to a multiple of
       5px, which keeps the pixel letters sharp (one of their pixels is a tenth
       of the font size). */
    --u: min(1vw, 1.7778vh);
    --state: #6f83ad;
    --ink: #eef1f6;
    --ink-2: #aab3c1;
    --ink-3: #7c8799;
    --bg-a: #141922;
    --bg-b: #07090d;
    --block: max(4px, round(calc(.6 * var(--u)), 2px));     /* one block of the intensity bar */
  }
  * { box-sizing: border-box; border-radius: 0; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 26% 62%, var(--bg-a), var(--bg-b) 70%);
    color: var(--ink);
    font-family: "Burnbot Pixel", ui-monospace, Menlo, monospace;
    -webkit-font-smoothing: none; font-smooth: never; text-rendering: optimizeSpeed;
    transition: --bg-a 2.5s;
    user-select: none;
  }
  body.s-asleep { --bg-a: #0f1626; }
  body.s-locked { --bg-a: #1f1812; }
  body.s-overdrive { --bg-a: #2a1214; }
  body.s-autopilot { --bg-a: #171427; }
  body.quiet { cursor: none; }
  p, h1 { margin: 0; }
  h1, b { font-weight: 400; }

  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }

  .top {
    position: fixed; top: calc(3 * var(--u)); left: calc(4 * var(--u)); right: calc(4 * var(--u));
    display: flex; align-items: center; justify-content: space-between;
    font-size: max(10px, round(calc(1.7 * var(--u)), 5px)); color: var(--ink-3);
  }
  .brand { display: flex; align-items: center; gap: calc(1 * var(--u)); color: var(--ink-2); text-transform: uppercase; letter-spacing: .1em; }
  #logo { height: calc(3.6 * var(--u)); image-rendering: pixelated; }

  .hud {
    position: fixed; left: 50vw; right: calc(4 * var(--u)); top: calc(8 * var(--u)); bottom: calc(9 * var(--u));
    display: flex; flex-direction: column; justify-content: center;
    text-shadow: .1em .1em 0 rgba(0, 0, 0, .6);        /* a hard shadow, one letter-pixel down and across */
  }
  .hud > * { flex-shrink: 0; }                        /* a tall HUD must not squeeze the bar (it has no content to keep it open) */
  .eyebrow { font-size: max(10px, round(calc(1.4 * var(--u)), 5px)); letter-spacing: .2em; text-transform: uppercase; color: var(--state); transition: color 1s steps(4); }
  #levelName { margin-top: calc(.6 * var(--u)); font-size: max(20px, round(calc(6.8 * var(--u)), 10px)); line-height: 1; white-space: nowrap; color: var(--state); transition: color 1s steps(4); }
  #sub { margin-top: calc(1.2 * var(--u)); font-size: max(10px, round(calc(1.8 * var(--u)), 5px)); color: var(--ink-2); min-height: 1.3em; }

  /* intensity as a bar of blocks; the ticks above it mark where a level begins */
  .track { position: relative; height: calc(var(--block) * 1.5); margin-top: calc(2.6 * var(--u)); max-width: calc(40 * var(--u)); }
  .track::before, .track i {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 100%;
    -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 var(--block), transparent var(--block) calc(var(--block) + 2px));
    mask-image: repeating-linear-gradient(90deg, #000 0 var(--block), transparent var(--block) calc(var(--block) + 2px));
    -webkit-mask-size: 100vw 100%; mask-size: 100vw 100%;
  }
  .track::before { background: color-mix(in srgb, var(--state) 22%, #171c25); }
  .track i { width: 0; background: var(--state); transition: width 1.2s steps(14), background 1s steps(4); }
  .track u { position: absolute; bottom: calc(100% + 2px); width: 2px; height: calc(var(--block) * .75); background: var(--ink-3); }
  #note { margin-top: calc(1 * var(--u)); font-size: max(10px, round(calc(1.4 * var(--u)), 5px)); color: var(--ink-3); }

  .cols { display: grid; grid-template-columns: 1fr calc(17 * var(--u)); gap: calc(2 * var(--u)); margin-top: calc(3 * var(--u)); align-items: start; }
  .stat b { display: block; font-size: max(20px, round(calc(5 * var(--u)), 10px)); line-height: 1; white-space: nowrap; }
  .stat span { display: block; margin-top: calc(.7 * var(--u)); font-size: max(10px, round(calc(1.4 * var(--u)), 5px)); color: var(--ink-3); }
  .stat + .stat { margin-top: calc(2.4 * var(--u)); }
  /* Today's wins against your goal, and the streak of days that made it. */
  .goal[hidden] { display: none; }
  .stat.goal b { font-size: max(15px, round(calc(3.5 * var(--u)), 5px)); }
  .stat + .goal { margin-top: calc(1.8 * var(--u)); }
  .goal b small { font-size: .5em; color: var(--ink-3); margin-left: .15em; }
  .goal.hit b { color: #4fc9a4; }
  .goal .pips { display: inline-flex; gap: calc(.35 * var(--u)); margin-left: calc(.8 * var(--u)); vertical-align: middle; }
  .goal .pips i { width: calc(.8 * var(--u)); height: calc(.8 * var(--u)); background: #4fc9a4; }

  /* the ladder: every level, top to bottom */
  .ladder { display: flex; flex-direction: column; gap: calc(.2 * var(--u)); }
  .rung { display: flex; align-items: center; gap: calc(.9 * var(--u)); height: calc(2.5 * var(--u)); padding: 0 calc(.9 * var(--u)); font-size: max(10px, round(calc(1.45 * var(--u)), 5px)); color: var(--ink-3); }
  .rung i { width: max(4px, round(calc(.8 * var(--u)), 2px)); height: max(4px, round(calc(.8 * var(--u)), 2px)); background: #2a313d; flex: none; }
  .rung span { flex: 1; white-space: nowrap; }
  .rung em { display: none; font-style: normal; font-size: max(10px, round(calc(1 * var(--u)), 5px)); text-transform: uppercase; color: var(--ink-3); text-shadow: none; }
  .rung.usual em { display: block; }
  .rung.lit { color: var(--ink-2); }
  .rung.lit i { background: var(--c); }
  .rung.now { color: var(--ink); background: color-mix(in srgb, var(--c) 18%, transparent); box-shadow: 0 -2px 0 0 var(--c), 0 2px 0 0 var(--c), -2px 0 0 0 var(--c), 2px 0 0 0 var(--c); }
  .rung.off { display: none; }
  .rung.off.now { display: flex; }

  #toast {
    position: fixed; left: 50%; bottom: calc(4 * var(--u)); transform: translateX(-50%);
    padding: .4em 1em; background: #12161d; color: var(--ink-2); box-shadow: 0 -2px 0 0 #3d4759, 0 2px 0 0 #3d4759, -2px 0 0 0 #3d4759, 2px 0 0 0 #3d4759;
    font-size: max(10px, round(calc(1.5 * var(--u)), 5px)); opacity: 0; transition: opacity .6s steps(4); pointer-events: none;
  }
  #toast.on { opacity: 1; }

  /* What is going on right now, under the robot. On a plate so it reads over the fire. */
  #now {
    position: fixed; left: 0; top: 0; transform: translateX(-50%);
    max-width: calc(100vw - 32px); padding: .35em .8em;
    background: rgba(7, 9, 13, .8); color: var(--ink-2);
    font-size: max(10px, round(calc(1.5 * var(--u)), 5px)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .6s steps(4); pointer-events: none;
  }
  #now.on { opacity: 1; }

  /* The robot speaking: a pixel speech bubble with a stepped tail pointing at its head. */
  #bubble {
    --p: max(3px, round(calc(.5 * var(--u)), 1px));         /* one pixel of the bubble's border */
    --line: var(--state);
    position: fixed; left: 0; top: 0; z-index: 5;
    width: max-content; max-width: min(calc(46 * var(--u)), calc(100vw - 32px));
    padding: calc(1.3 * var(--u)) calc(1.8 * var(--u)) calc(1.5 * var(--u));
    background: #0b0f15; color: var(--ink);
    box-shadow: 0 calc(-1 * var(--p)) 0 0 var(--line), 0 var(--p) 0 0 var(--line), calc(-1 * var(--p)) 0 0 0 var(--line), var(--p) 0 0 0 var(--line),
      0 0 0 calc(2 * var(--p)) rgba(0, 0, 0, .35);
    visibility: hidden; opacity: 0; transform: translateY(calc(2 * var(--p)));
    transition: opacity .25s steps(3), transform .25s steps(3), visibility 0s .25s;
    cursor: pointer; text-shadow: none;
  }
  .hud { transition: opacity .4s steps(3); }
  body.speaking .hud { opacity: 0; }
  #bubble.on { visibility: visible; opacity: 1; transform: none; transition: opacity .25s steps(3), transform .25s steps(3); }
  #bubble.urgent { --line: #ffd25e; }
  #bubble.happy { --line: #4fc9a4; }
  #bubble h2 { margin: 0 0 .7em; font-size: max(10px, round(calc(1.5 * var(--u)), 5px)); font-weight: 400; letter-spacing: .2em; text-transform: uppercase; color: var(--line); }
  #bubble p { font-size: max(10px, round(calc(1.9 * var(--u)), 5px)); line-height: 1.45; }
  #bubble p + p { color: var(--ink-2); }
  #bubble small { display: block; margin-top: 1em; font-size: max(10px, round(calc(1.2 * var(--u)), 5px)); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  #bubble small:empty { display: none; }
  /* The tail: three steps, drawn in the border's colour. Below the bubble, or to its left. */
  #bubble .tail { position: absolute; width: var(--p); height: var(--p); background: var(--line);
    box-shadow: var(--p) 0 var(--line), calc(2 * var(--p)) 0 var(--line), 0 var(--p) var(--line), var(--p) var(--p) var(--line), 0 calc(2 * var(--p)) var(--line); }
  #bubble.side .tail {
    box-shadow: 0 var(--p) var(--line), 0 calc(2 * var(--p)) var(--line), calc(-1 * var(--p)) 0 var(--line), calc(-1 * var(--p)) var(--p) var(--line), calc(-2 * var(--p)) 0 var(--line); }

  /* Tall or square windows: robot below, level above. */
  @media (max-aspect-ratio: 5/4) {
    :root { --u: min(1.9vw, 1.05vh); }
    body { background: radial-gradient(120% 70% at 50% 78%, var(--bg-a), var(--bg-b) 70%); }
    .hud { left: calc(4 * var(--u)); right: calc(4 * var(--u)); top: calc(10 * var(--u)); bottom: auto; display: block; }
  }
  /* A small window, such as the robot floating in a corner: just the robot,
     the level, and the burn. Make it bigger for the rest. */
  @media (max-width: 760px) and (min-aspect-ratio: 5/4) {
    :root { --u: min(1.55vw, 2.75vh); }
    .brand b, #clock, #sub, .track, #note, .stat + .stat:not(.goal), .cols > .ladder { display: none; }
    .goal b { font-size: max(15px, round(calc(2.6 * var(--u)), 5px)); display: inline; }
    .goal span { display: inline; margin-left: calc(.8 * var(--u)); }
    .stat + .goal { margin-top: calc(1.6 * var(--u)); }
    .top { top: calc(3.2 * var(--u)); left: calc(3 * var(--u)); }
    .hud { left: 47vw; right: calc(3 * var(--u)); top: calc(4 * var(--u)); bottom: calc(7 * var(--u)); }
    #levelName { font-size: max(20px, round(calc(5.6 * var(--u)), 10px)); }
    .cols { display: block; margin-top: calc(2.4 * var(--u)); }
  }
  /* On a screen that is not Retina half pixels cannot be drawn: let them soften instead of wobble. */
  @media (-webkit-max-device-pixel-ratio: 1.5), (max-resolution: 1.5dppx) { body { -webkit-font-smoothing: auto; font-smooth: auto; } }
  @media (prefers-reduced-motion: reduce) { .track i, .rung, .rung i, #bubble, #now { transition: none; } }
</style>
</head>
<body class="s-asleep">
  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="top">
    <span class="brand"><canvas id="logo" aria-hidden="true"></canvas><b>Burnbot</b></span>
    <span id="clock"></span>
  </header>

  <main class="hud">
    <p class="eyebrow" id="levelCap">Level</p>
    <h1 id="levelName">&nbsp;</h1>
    <p id="sub">Reading your history…</p>
    <div class="track" id="track"><i id="bar"></i></div>
    <p id="note"></p>

    <div class="cols">
      <div>
        <div class="stat"><b id="rate">0</b><span>tokens per hour</span></div>
        <div class="stat"><b id="today">0</b><span id="pace">burned today</span></div>
        <div class="stat goal" id="goal" hidden><b id="wins">0</b><span id="goalNote">wins today</span></div>
      </div>
      <div class="ladder" id="ladder" role="list" aria-label="Levels"></div>
    </div>
  </main>

  <p id="now" aria-live="polite"></p>
  <div id="bubble" role="status" aria-live="assertive"><h2 id="bubbleTitle"></h2><div id="bubbleLines"></div><small id="bubbleHint"></small><i class="tail"></i></div>

  <div id="toast"></div>
  <script type="module" src="/display.js"></script>
</body>
</html>
