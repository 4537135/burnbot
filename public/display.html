<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burnbot</title>
<link rel="icon" id="favicon" href="data:,">
<style>
  @property --bg-a { syntax: "<color>"; inherits: true; initial-value: #141922; }
  :root {
    /* One unit is 1% of the largest 16:9 box that fits the window, so the
       layout scales to any size. */
    --u: min(1vw, 1.7778vh);
    --state: #6f83ad;
    --ink: #eef1f6;
    --ink-2: #aab3c1;
    --ink-3: #6c7686;
    --bg-a: #141922;
    --bg-b: #07090d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 26% 62%, var(--bg-a), var(--bg-b) 70%);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: --bg-a 2.5s;
    user-select: none;
  }
  body.s-asleep { --bg-a: #0f1626; }
  body.s-locked { --bg-a: #1f1812; }
  body.s-overdrive { --bg-a: #2a1214; }
  body.s-autopilot { --bg-a: #171427; }
  body.quiet { cursor: none; }
  p, h1 { margin: 0; }

  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }

  .top {
    position: fixed; top: calc(3 * var(--u)); left: calc(4 * var(--u)); right: calc(4 * var(--u));
    display: flex; align-items: center; justify-content: space-between;
    font-size: calc(1.7 * var(--u)); font-weight: 650; color: var(--ink-3);
  }
  .brand { display: flex; align-items: center; gap: calc(1 * var(--u)); color: var(--ink-2); }
  #logo { height: calc(3.6 * var(--u)); image-rendering: pixelated; }
  #clock { font-variant-numeric: tabular-nums; }

  .hud {
    position: fixed; left: 50vw; right: calc(4 * var(--u)); top: calc(8 * var(--u)); bottom: calc(9 * var(--u));
    display: flex; flex-direction: column; justify-content: center;
    text-shadow: 0 0 calc(1.2 * var(--u)) rgba(0, 0, 0, .85);
  }
  .eyebrow { font-size: calc(1.25 * var(--u)); font-weight: 750; letter-spacing: .16em; text-transform: uppercase; color: var(--state); transition: color 1s; }
  #levelName { margin-top: calc(.5 * var(--u)); font-size: calc(6.8 * var(--u)); line-height: 1; font-weight: 800; letter-spacing: -.02em; color: var(--state); transition: color 1s; }
  #sub { margin-top: calc(1.1 * var(--u)); font-size: calc(1.8 * var(--u)); font-weight: 500; color: var(--ink-2); min-height: 1.3em; }

  /* intensity, with a notch where each level begins */
  .track { position: relative; height: calc(.7 * var(--u)); margin-top: calc(2 * var(--u)); max-width: calc(40 * var(--u)); background: color-mix(in srgb, var(--state) 18%, #171c25); border-radius: 99px; }
  .track i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--state); border-radius: 99px; transition: width 1.2s cubic-bezier(.2, .8, .2, 1), background 1s; }
  .track u { position: absolute; top: -30%; bottom: -30%; width: max(2px, calc(.18 * var(--u))); background: var(--bg-b); }
  #note { margin-top: calc(.9 * var(--u)); font-size: calc(1.35 * var(--u)); color: var(--ink-3); }

  .cols { display: grid; grid-template-columns: 1fr calc(17 * var(--u)); gap: calc(2 * var(--u)); margin-top: calc(3 * var(--u)); align-items: start; }
  .stat b { display: block; font-size: calc(5 * var(--u)); line-height: 1; font-weight: 750; letter-spacing: -.02em; }
  .stat span { display: block; margin-top: calc(.6 * var(--u)); font-size: calc(1.4 * var(--u)); color: var(--ink-3); }
  .stat + .stat { margin-top: calc(2.4 * var(--u)); }
  #today { font-variant-numeric: tabular-nums; }

  /* the ladder: every level, top to bottom */
  .ladder { display: flex; flex-direction: column; gap: calc(.2 * var(--u)); }
  .rung { display: flex; align-items: center; gap: calc(.9 * var(--u)); height: calc(2.5 * var(--u)); padding: 0 calc(.9 * var(--u)); border-radius: calc(.7 * var(--u)); font-size: calc(1.45 * var(--u)); font-weight: 600; color: var(--ink-3); transition: color .8s, background .8s; }
  .rung i { width: calc(.8 * var(--u)); height: calc(.8 * var(--u)); border-radius: 50%; background: #2a313d; flex: none; transition: background .8s, box-shadow .8s; }
  .rung span { flex: 1; white-space: nowrap; }
  .rung em { display: none; font-style: normal; font-size: calc(1.05 * var(--u)); font-weight: 600; color: var(--ink-3); text-shadow: none; }
  .rung.usual em { display: block; }
  .rung.lit { color: var(--ink-2); }
  .rung.lit i { background: var(--c); }
  .rung.now { color: var(--ink); background: color-mix(in srgb, var(--c) 16%, transparent); }
  .rung.now i { box-shadow: 0 0 calc(.9 * var(--u)) var(--c); }
  .rung.off { display: none; }
  .rung.off.now { display: flex; }

  #toast {
    position: fixed; left: 50%; bottom: calc(4 * var(--u)); transform: translateX(-50%);
    padding: .5em 1em; border-radius: 99px; background: rgba(0, 0, 0, .6); color: var(--ink-2);
    font-size: calc(1.5 * var(--u)); opacity: 0; transition: opacity .6s; pointer-events: none;
  }
  #toast.on { opacity: 1; }

  /* Tall or square windows: robot below, level above. */
  @media (max-aspect-ratio: 5/4) {
    :root { --u: min(1.9vw, 1.05vh); }
    body { background: radial-gradient(120% 70% at 50% 78%, var(--bg-a), var(--bg-b) 70%); }
    .hud { left: calc(4 * var(--u)); right: calc(4 * var(--u)); top: calc(10 * var(--u)); bottom: auto; display: block; }
  }
  /* A small window, such as the robot floating in a corner: just the robot,
     the level, and the burn. Make it bigger for the rest. */
  @media (max-width: 760px) and (min-aspect-ratio: 5/4) {
    :root { --u: min(1.55vw, 2.75vh); }
    .brand b, #clock, #sub, .track, #note, .stat + .stat, .cols > .ladder { display: none; }
    .top { top: calc(3.2 * var(--u)); left: calc(3 * var(--u)); }
    .hud { left: 47vw; right: calc(3 * var(--u)); top: calc(4 * var(--u)); bottom: calc(7 * var(--u)); }
    #levelName { font-size: calc(5.6 * var(--u)); }
    .cols { display: block; margin-top: calc(2.4 * var(--u)); }
  }
  @media (prefers-reduced-motion: reduce) { .track i, .rung, .rung i { transition: none; } }
</style>
</head>
<body class="s-asleep">
  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="top">
    <span class="brand"><canvas id="logo" aria-hidden="true"></canvas><b>Burnbot</b></span>
    <span id="clock"></span>
  </header>

  <main class="hud">
    <p class="eyebrow" id="levelCap">Level</p>
    <h1 id="levelName">&nbsp;</h1>
    <p id="sub">Reading your history…</p>
    <div class="track" id="track"><i id="bar"></i></div>
    <p id="note"></p>

    <div class="cols">
      <div>
        <div class="stat"><b id="rate">0</b><span>tokens per hour</span></div>
        <div class="stat"><b id="today">0</b><span id="pace">burned today</span></div>
      </div>
      <div class="ladder" id="ladder" role="list" aria-label="Levels"></div>
    </div>
  </main>

  <div id="toast"></div>
  <script type="module" src="/display.js"></script>
</body>
</html>
